# Builds Windows, macOS and Linux players on every push to main, and publishes them as a
# downloadable GitHub Release when you push a version tag (tools/unmasked.sh release v0.1.0).
#
# One-time setup: Unity needs a license to build in the cloud. Run `unmasked secrets` from
# tools/unmasked.sh (or add UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD under
# Settings > Secrets and variables > Actions). Without them this workflow skips the build politely.
name: Build game

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { targetPlatform: StandaloneWindows64, name: Windows }
          - { targetPlatform: StandaloneOSX, name: macOS }
          - { targetPlatform: StandaloneLinux64, name: Linux }
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Explain missing license
        if: env.HAS_LICENSE != 'true'
        run: echo "::notice::No UNITY_LICENSE secret yet, so the build was skipped. Run 'unmasked secrets' to add it."

      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        if: env.HAS_LICENSE == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Unmasked
          buildMethod: Unmasked.EditorTools.BuildScript.BuildFromCommandLine

      - name: Zip the player
        if: env.HAS_LICENSE == 'true'
        run: |
          sudo chown -R "$USER" build
          cd build/${{ matrix.targetPlatform }}
          zip -qr "$GITHUB_WORKSPACE/Unmasked-${{ matrix.name }}.zip" .

      - uses: actions/upload-artifact@v4
        if: env.HAS_LICENSE == 'true'
        with:
          name: Unmasked-${{ matrix.name }}
          path: Unmasked-${{ matrix.name }}.zip

  release:
    name: Publish downloads
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Download and play
            - **Windows:** unzip `Unmasked-Windows.zip`, run `Unmasked.exe` (SmartScreen: More info > Run anyway).
            - **macOS:** unzip `Unmasked-macOS.zip`, then in Terminal: `xattr -cr Unmasked.app` and open it.
            - **Linux:** unzip `Unmasked-Linux.zip`, then `chmod +x Unmasked.x86_64 && ./Unmasked.x86_64`.

            One player clicks **Host**; friends click **Join** with the host's IP (port 7777, UDP).
