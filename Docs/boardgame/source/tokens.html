<!doctype html><html><head><meta charset="utf-8"><script src="art.js"></script><script src="icons2.js"></script></head><body><div id="art"></div><script>
document.head.insertAdjacentHTML('beforeend', FONTS);
// Letter page 8.5x11in at 100 units/in -> 850x1100
let s=`<rect width="850" height="1100" fill="#fff"/>`;
const T=(x,y,t,sz,o={})=>`<text x="${x}" y="${y}" font-family="${o.font||'Fraunces'}" font-weight="700" font-size="${sz}" fill="${o.fill||C.ink}" text-anchor="middle">${t}</text>`;
s+=T(425,50,'UNMASKED · Tokens (cut out; glue to card for thickness)',22);
const R=45; // 0.9in tokens
const order=['PembertonCottage','HollowCreekFarm','WillowLaneVictorian','BlackwoodManor','HistoricalSociety'];
let y=110;
order.forEach((h,hi)=>{const m=HOUSE_META[h];s+=`<text x="40" y="${y+5}" font-family="Atkinson" font-weight="700" font-size="13" fill="${C.red}">${'①②③④⑤'[hi]} ${m.short}</text>`;
 for(let t=0;t<8;t++){const x=150+t*88;s+=circ(x,y,R*.95,C.parch,`stroke="${C.ink}" stroke-width="2"`)+ICON[m.icons[t]](x,y-4,1.5)+T(x,y+30,'#'+(t+1),12,{font:'Atkinson',fill:C.red});}
 y+=100;});
s+=T(425,y-25,'Decoy markers (hide one under each decoy clue) · Blanks · Lanterns · Curios · Snacks · Hex',15);
y+=20;
for(let i=0;i<8;i++){const x=70+i*100;if(i<4)s+=circ(x,y,R*.95,'#efe8f7',`stroke="${C.violet}" stroke-width="2"`)+ICON.ghost(x,y-4,1.4)+T(x,y+30,'decoy',10,{font:'Atkinson',fill:C.violet});else s+=circ(x,y,R*.95,C.parch,`stroke="${C.ink}" stroke-width="2"`)+T(x,y+4,'nothing',11,{font:'Atkinson',fill:C.inkSoft})+T(x,y+18,'here',11,{font:'Atkinson',fill:C.inkSoft});}
y+=100;
for(let i=0;i<16;i++){const x=55+(i%8)*105,yy=y+Math.floor(i/8)*95;s+=circ(x,yy,R*.9,C.amber,`stroke="${C.ink}" stroke-width="2"`)+ICON.lantern(x,yy,1.6);}
y+=200;
for(let i=0;i<8;i++){const x=55+i*105;const k=i<6?'curio':i<7?'snack':'hex';s+=circ(x,y,R*.9,k==='curio'?C.tealLL:k==='snack'?'#f4d6a0':'#cfc0e8',`stroke="${C.ink}" stroke-width="2"`)+(k==='curio'?ICON.magnifier(x,y-4,1.5):k==='snack'?ICON.cake(x,y-4,1.4):ICON.ghost(x,y-4,1.3))+T(x,y+30,k,10,{font:'Atkinson'});}
document.getElementById('art').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="2550" height="3300">${DEFS}${s}</svg>`;
document.fonts.ready.then(()=>{window.READY=true});
</script></body></html>
