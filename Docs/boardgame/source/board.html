const free = (x, y, r) => !exclude.some(([a, b, rr]) => Math.hypot(a - x, b - y) < rr + r) && x > 70 && x < 850 && y > 75 && y < 930;
const placed = [];
for (let i = 0; i < 2600 && placed.length < 260; i++) { const x = 70 + rnd() * 790, y = 75 + rnd() * 860; const r = 6 + rnd() * 5; if (!free(x, y, r * .8) || placed.some(([a, b]) => Math.hypot(a - x, b - y) < r * 1.3)) continue; placed.push([x, y, r]); }
placed.sort((a, b) => a[1] - b[1]);
for (const [x, y, r] of placed) { const k = rnd(); scatter += tree(x, y, r, y < 260 || (x < 230 && y > 780) ? (k < .5 ? 'pine' : k < .7 ? 'bare' : 'round') : (k < .45 ? 'round' : k < .65 ? 'orange' : k < .8 ? 'gold' : 'pine')); }
// pumpkin patches + lamps along ring
let deco = '';
for (let i = 0; i < 14; i++) { const x = 238 + rnd() * 170, y = 735 + rnd() * 70; if (free(x, y, 2)) deco += pumpkin(x, y, 2 + rnd()); }
roads.forEach((d, ri) => { P.setAttribute('d', d); const L = P.getTotalLength(); for (let t = 30; t < L; t += 70) { const q = P.getPointAtLength(t), q2 = P.getPointAtLength(Math.min(L, t + 1)); const nx = -(q2.y - q.y), ny = q2.x - q.x, n = Math.hypot(nx, ny) || 1; deco += lamp(q.x + nx / n * 12, q.y + ny / n * 12, .9); } });

// ---------- spaces ----------
let sp = '';
// mark location (big) spaces near each location building
const locs = [[320, 404, '1'], [690, 397, '3'], [352, 772, '2'], [598, 612, '5'], [484, 270, '4'], [206, 220, 'C'], [178, 452, 'C'], [562, 790, 'C'], [826, 527, 'C'], [782, 240, 'C'], [207, 836, 'C'], [500, 450, 'HQ']];
const isLoc = s => locs.some(([x, y]) => Math.hypot(s.x - x, s.y - y) < 24);
spaces.forEach((s, i) => {
  if (isLoc(s)) return;
  const kind = i % 5 === 2 ? 'lantern' : i % 7 === 3 ? 'haunt' : 'plain';
  const fill = kind === 'lantern' ? C.amberL : kind === 'haunt' ? C.violetL : C.parch;
  sp += circ(s.x + .8, s.y + 1.6, 8.2, '#0d1a1c', 'opacity=".45"') + circ(s.x, s.y, 8, fill, `stroke="${C.ink}" stroke-width="1.3"`) + circ(s.x, s.y, 6.2, 'none', `stroke="${shade(fill, .7)}" stroke-width=".6"`);
  if (kind === 'lantern') sp += ICON.lantern(s.x, s.y, .32); else if (kind === 'haunt') sp += ICON.ghost(s.x, s.y + .5, .4);
});
for (const [x, y, t] of locs) {
  const col = t === 'HQ' ? C.amber : t === 'C' ? C.violet : C.red;
  sp += circ(x + 1, y + 2, 13.5, '#0d1a1c', 'opacity=".5"') + circ(x, y, 13, C.parch, `stroke="${C.ink}" stroke-width="1.6"`) + circ(x, y, 10, col, `stroke="${C.ink}" stroke-width="1"`);
  sp += t === 'C' ? ICON.ghost(x, y + .5, .58) : `<text x="${x}" y="${y + (t === 'HQ' ? 3 : 4)}" font-family="Fraunces" font-weight="700" font-size="${t === 'HQ' ? 8 : 12}" fill="${C.parch}" text-anchor="middle">${t}</text>`;
}

// ---------- assemble buildings in depth order ----------
B.sort((a, b) => a.y - b.y);
let bs = '', labs = '';
for (const b of B) { bs += b.svg; if (b.lab) { const above = b.sub && b.sub !== 'start here' && b.lab !== 'Nine Widows' && b.lab !== 'Saltmarsh Harbor'; labs += label(b.x, above ? b.y - b.h - 10 : b.y + (b.ls > 6 ? 14 : 10), b.lab, b.ls, above ? null : b.sub); } }

// ---------- frame: title, midnight track, fear & lantern border ----------
let fr = '';
fr += `<path d="M0,0 H1000 V1000 H0 Z M60,60 V940 H940 V60 Z" fill-rule="evenodd" fill="${C.parch}"/>`;
fr += `<path d="M0,0 H1000 V1000 H0 Z M60,60 V940 H940 V60 Z" fill-rule="evenodd" fill="${C.parchDD}" filter="url(#grain)"/>`;
fr += `<rect x="58" y="58" width="884" height="884" fill="none" stroke="${C.ink}" stroke-width="3"/><rect x="50" y="50" width="900" height="900" fill="none" stroke="${C.ink}" stroke-width="1"/><rect x="10" y="10" width="980" height="980" fill="none" stroke="${C.ink}" stroke-width="1.5"/>`;
// midnight track (bottom): 12 spaces dusk -> midnight
const hours = ['6', '7', '8', '9', '10', '11', '12'];
for (let i = 0; i < 12; i++) { const x = 160 + i * 58, y = 970 - 18; const mid = i === 11; fr += `<circle cx="${x}" cy="${y - 2}" r="15" fill="${mid ? C.violet : i > 7 ? '#3b2c52' : C.tealM}" stroke="${C.ink}" stroke-width="1.6"/><text x="${x}" y="${y + 3}" font-family="Fraunces" font-weight="700" font-size="${mid ? 10 : 13}" fill="${C.parch}" text-anchor="middle">${mid ? '12' : i + 1}</text>`; if (i < 11) fr += `<path d="M${x + 17},${y - 2} h24" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="3 3"/>`; }
fr += `<text x="95" y="960" font-family="Fraunces" font-weight="700" font-size="13" fill="${C.ink}" text-anchor="middle">DUSK</text><text x="905" y="960" font-family="Fraunces" font-weight="700" font-size="11" fill="${C.violet}" text-anchor="middle">MIDNIGHT</text>`;
// title (top)
fr += `<text x="500" y="44" font-family="Fraunces" font-weight="700" font-size="34" fill="${C.ink}" text-anchor="middle" letter-spacing="6">UNMASKED</text>`;
fr += `<text x="300" y="38" font-family="Atkinson" font-style="italic" font-size="11" fill="${C.inkSoft}" text-anchor="middle">Solve the haunting.</text><text x="700" y="38" font-family="Atkinson" font-style="italic" font-size="11" fill="${C.inkSoft}" text-anchor="middle">Unmask the person.</text>`;
fr += ICON.lantern(150, 30, .9) + ICON.lantern(850, 30, .9);
// left border: Fear track 0..5 (shared co-op fear); right: lantern hook board (12)
for (let i = 0; i < 6; i++) { const y = 260 + i * 80; fr += `<circle cx="30" cy="${y}" r="15" fill="${i === 5 ? C.violet : C.parch}" stroke="${C.ink}" stroke-width="1.5"/>` + (i === 5 ? ICON.ghost(30, y + 1, .7) : `<text x="30" y="${y + 5}" font-family="Fraunces" font-weight="700" font-size="14" fill="${C.ink}" text-anchor="middle">${i}</text>`); }
fr += `<text transform="translate(34,180) rotate(-90)" font-family="Fraunces" font-weight="700" font-size="14" fill="${C.ink}" text-anchor="middle">FEAR</text>`;
for (let i = 0; i < 12; i++) { const y = 165 + i * 60; fr += `<path d="M960,${y - 14} q10,-6 20,0" stroke="${C.ink}" stroke-width="1.4" fill="none"/><circle cx="970" cy="${y}" r="12" fill="${C.parchD}" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="2 2"/><text x="970" y="${y + 4}" font-family="Atkinson" font-weight="700" font-size="10" fill="${C.inkSoft}" text-anchor="middle">${i + 1}</text>`; }
fr += `<text transform="translate(970,100) rotate(90)" font-family="Fraunces" font-weight="700" font-size="12" fill="${C.ink}" text-anchor="middle">HOOK BOARD</text>`;
// corner moons/pumpkins
fr += circ(30, 30, 18, 'url(#moon)') + pumpkin(970, 985, 8) + pumpkin(30, 985, 8);
// compass + legend on map (bottom-right inside)
const legend = `<g transform="translate(860,880)"><circle r="26" fill="${C.parch}" stroke="${C.ink}" stroke-width="1.4" opacity=".95"/><path d="M0,-22 L5,0 L0,22 L-5,0 Z" fill="${C.red}" stroke="${C.ink}" stroke-width=".8"/><path d="M-22,0 L0,-4 L22,0 L0,4 Z" fill="${C.ink}"/><text y="-28" font-family="Fraunces" font-weight="700" font-size="9" text-anchor="middle" fill="${C.parch}" stroke="${C.ink}" stroke-width="2" paint-order="stroke">N</text></g>`;

const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="4096" height="4096">${DEFS}${g}${scatter}${deco}${bs}${sp}${labs}${legend}<rect x="60" y="60" width="880" height="880" fill="url(#vig)"/>${fr}<rect width="1000" height="1000" fill="#000" filter="url(#grain)" opacity=".35"/></svg>`;
document.getElementById('art').innerHTML = svg;
document.fonts.ready.then(() => { window.READY = true; });
</script></body></html>
