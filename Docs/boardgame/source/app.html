<!doctype html><html><head><meta charset="utf-8"><script src="art.js"></script></head><body>
<div id="art"></div>
<script>
document.head.insertAdjacentHTML('beforeend', FONTS);
const T=(x,y,t,size,o={})=>`<text x="${x}" y="${y}" font-family="${o.font||'Atkinson'}" font-weight="${o.w||400}" font-size="${size}" fill="${o.fill||C.ink}" text-anchor="${o.anchor||'start'}" ${o.ls?`letter-spacing="${o.ls}"`:''}>${t}</text>`;
let s=`<rect width="1600" height="1000" fill="#2b2320"/><rect width="1600" height="1000" fill="#7a5a3a" filter="url(#mottle)" opacity=".6"/>`;
// cork board panel
s+=`<rect x="0" y="0" width="1600" height="84" fill="${C.teal}"/>`+T(40,55,'UNMASKED',36,{font:'Fraunces',w:700,fill:C.parch,ls:4})+T(330,52,'Board Game Companion  ·  Case ① The Missing Harvest Lantern',22,{fill:C.amberL});
s+=`<rect x="1290" y="20" width="280" height="44" rx="22" fill="${C.violet}"/>`+T(1430,50,'HAUNTER IS THINKING…',18,{w:700,fill:C.parch,anchor:'middle'});
// left: midnight clock
s+=`<g transform="translate(230,330)"><circle r="170" fill="${C.parch}" stroke="${C.ink}" stroke-width="6"/>`;
for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2-Math.PI/2;s+=`<circle cx="${Math.cos(a)*140}" cy="${Math.sin(a)*140}" r="16" fill="${i<7?C.tealM:i<11?'#3b2c52':C.violet}"/>`+T(Math.cos(a)*140,Math.sin(a)*140+7,i===0?12:i,18,{w:700,fill:C.parch,anchor:'middle'});}
s+=`<path d="M0,0 L${Math.cos(-Math.PI/2+7/12*Math.PI*2)*100},${Math.sin(-Math.PI/2+7/12*Math.PI*2)*100}" stroke="${C.ink}" stroke-width="10" stroke-linecap="round"/><circle r="12" fill="${C.red}"/></g>`;
s+=T(230,540,'Round 7 of 12',30,{font:'Fraunces',w:700,fill:C.parch,anchor:'middle'})+T(230,575,'Fear  ●●○○○',24,{fill:C.violetL,anchor:'middle'});
// center: haunter card big
s+=`<g transform="translate(470,120)"><rect width="520" height="520" rx="20" fill="#2c2140" stroke="${C.ink}" stroke-width="4"/>${haunter('jack',260,230,2)}${T(260,440,'Stingy Jack possesses the teapot!',30,{font:'Fraunces',w:700,fill:C.parch,anchor:'middle'})}${T(260,480,'Solvers in the Kitchen: +1 Fear, drop a clue.',22,{fill:C.violetL,anchor:'middle'})}</g>`;
// right: suspect board mini
s+=`<g transform="translate(1030,120)"><rect width="530" height="520" rx="12" fill="${C.parch}" stroke="${C.ink}" stroke-width="4"/>${T(24,46,'Suspect Board',30,{font:'Fraunces',w:700})}`;
const sus=[['Hank Moody',[0,4,5],1],['Daisy Pemberton',[1,4,6],0],['Leonard Crisp',[2,6,7],1],['Beatrice Hollis',[3,7,5],0]];
sus.forEach(([n,t,x],i)=>{const y=80+i*104;s+=`<rect x="20" y="${y}" width="490" height="92" rx="8" fill="${x?'#e9d9b5':C.parchD}" stroke="${C.ink}" stroke-width="2"/>`+T(40,y+38,n,26,{font:'Fraunces',w:700})+t.map((k,j)=>`<circle cx="${330+j*60}" cy="${y+46}" r="24" fill="${k===4||k===7?'#f6d6c8':C.parch}" stroke="${k===4||k===7?C.red:C.ink}" stroke-width="3"/>`+ICON[TRAIT_ICON[k]](330+j*60,y+46,1.1)).join('')+(x?`<path d="M30,${y+46} H300" stroke="${C.red}" stroke-width="5" stroke-linecap="round" opacity=".8"/>`:'')+T(40,y+70,x?'cleared':'',16,{fill:C.red});});
s+=`</g>`;
// bottom keypad
s+=`<g transform="translate(470,680)"><rect width="1090" height="280" rx="16" fill="${C.parch}" stroke="${C.ink}" stroke-width="4"/>${T(30,52,'Found a clue token? Type its number.',28,{font:'Fraunces',w:700})}`;
for(let i=0;i<8;i++)s+=`<rect x="${30+i*130}" y="90" width="110" height="110" rx="14" fill="${i===6?C.red:C.parchD}" stroke="${C.ink}" stroke-width="3"/>`+ICON[TRAIT_ICON[i]](85+i*130,135,1.4)+T(85+i*130,190,'#'+(i+1),22,{w:700,anchor:'middle',fill:i===6?C.parch:C.ink});
s+=T(30,245,'Gold locket logged. The app keeps the culprit secret and plays the Haunter for you.',20,{fill:C.inkSoft});
s+=`</g><g transform="translate(40,680)"><rect width="380" height="280" rx="16" fill="${C.teal}" stroke="${C.ink}" stroke-width="4"/>${T(190,60,'Case code',24,{fill:C.tealLL,anchor:'middle'})}${T(190,120,'HC-01-LANTERN',36,{w:700,fill:C.amberL,anchor:'middle',ls:2})}${T(190,180,'Same suspects, clues and',20,{fill:C.parch,anchor:'middle'})}${T(190,208,'motives as the video game.',20,{fill:C.parch,anchor:'middle'})}</g>`;
document.getElementById('art').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">${DEFS}${s}</svg>`;
document.fonts.ready.then(()=>{window.READY=true});
</script></body></html>
