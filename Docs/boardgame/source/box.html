<!doctype html><html><head><meta charset="utf-8"><script src="art.js"></script></head><body>
<div id="art"></div>
<script>
document.head.insertAdjacentHTML('beforeend', FONTS);
const T=(x,y,t,size,o={})=>`<text x="${x}" y="${y}" font-family="${o.font||'Fraunces'}" font-weight="${o.w||700}" font-size="${size}" fill="${o.fill||C.ink}" text-anchor="${o.anchor||'middle'}" ${o.ls?`letter-spacing="${o.ls}"`:''} ${o.stroke?`stroke="${o.stroke}" stroke-width="${o.sw||4}" paint-order="stroke"`:''} ${o.italic?'font-style="italic"':''}>${t}</text>`;
let s='';
// LID 1000x1000
s+=`<rect width="1000" height="1000" fill="url(#sky)"/>`;
for(let i=0;i<120;i++)s+=circ(rnd()*1000,rnd()*560,.6+rnd()*1.4,'#fff',`opacity="${.3+rnd()*.6}"`);
s+=circ(760,250,170,'url(#moon)','opacity=".95"')+circ(760,250,95,'#fbf0cc')+circ(735,225,14,'#efe0b0','opacity=".7"')+circ(790,280,9,'#efe0b0','opacity=".7"');
// bats
for(const [x,y,k] of [[640,170,1],[860,330,.7],[700,120,.6]])s+=`<path transform="translate(${x},${y}) scale(${k})" d="M0,0 q-8,-10 -20,-6 q6,4 4,10 q-6,-2 -10,4 q12,-2 16,4 q2,-6 10,-12 q8,6 10,12 q4,-6 16,-4 q-4,-6 -10,-4 q-2,-6 4,-10 q-12,-4 -20,6Z" fill="#1a1428"/>`;
// hills + manor silhouette w/ lit windows
s+=`<path d="M0,600 C180,520 300,560 420,500 C520,450 640,470 760,520 C860,560 940,540 1000,520 V1000 H0 Z" fill="#1d3433"/>`;
s+=`<g transform="translate(150,-210) scale(2.6)">${building({x:160,y:300,w:28,h:50,rh:26,wall:'#5c566a',roof:'#221e2e',kind:'gable',cols:2,rows:3,arch:true,door:false})}${building({x:235,y:300,w:28,h:50,rh:26,wall:'#5c566a',roof:'#221e2e',kind:'gable',cols:2,rows:3,arch:true,door:false})}${building({x:197,y:303,w:48,h:40,rh:22,wall:'#665f74',roof:'#221e2e',kind:'mansard',cols:3,rows:2,arch:true,lit:.9})}${building({x:197,y:255,w:14,h:22,rh:22,wall:'#665f74',roof:'#221e2e',kind:'gable',cols:1,door:false,gableWin:false})}</g>`;
for(const [x,k] of [[80,1.6],[170,1.2],[880,1.5],[950,1.1]])s+=tree(x,560,26*k,'pine');
s+=tree(240,600,28,'bare')+tree(820,590,26,'bare');
// haunter rising behind
s+=`<g opacity=".95">${circ(250,420,120,C.violet,'opacity=".22"')}${haunter('jack',250,420,1.35)}</g>`;
// mist
s+=`<path d="M0,640 C200,600 300,660 500,630 C700,600 800,660 1000,620 V700 H0Z" fill="${C.tealLL}" opacity=".18"/>`;
s+=`<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#284a44"/><stop offset="1" stop-color="#14262a"/></linearGradient><path d="M0,640 C200,610 400,650 600,625 C800,605 900,640 1000,625 V1000 H0Z" fill="url(#gr)"/>`;
// flashlight beams
s+=`<path d="M390,760 L210,400 L300,380 Z" fill="${C.amberL}" opacity=".16"/><path d="M610,760 L250,450 L320,420 Z" fill="${C.amberL}" opacity=".12"/>`;
// four solvers (busts) peeking
const P=[{skin:'#e9b892',hair:'#2d2420',hairStyle:'spiky',outfit:'#a83232',scarf:C.amber,mood:'cross'},{skin:'#f1c9a5',hair:'#6b3a2a',hairStyle:'short',outfit:'#3e7a4a',outfit2:'#2e5c38',collar:'cape',hat:'deerstalker',hatc:'#8a6a3e',mood:'happy'},{skin:'#b9825e',hair:'#1f1a1c',hairStyle:'curly',outfit:'#2f5a9a',headphones:'#e2b23c',glasses:C.ink,mood:'open'},{skin:'#f4d1b5',hair:'#a8693a',hairStyle:'bob',outfit:'#d8b23a',hat:'bobble',hatc:'#5aa39a',freckles:true,mood:'worried'}];
[[170,800,1.55],[390,770,1.75],[610,770,1.75],[830,800,1.55]].forEach(([x,y,k],i)=>{s+=`<ellipse cx="${x}" cy="${y+150}" rx="${100*k/1.6}" ry="20" fill="#000" opacity=".3"/>`+portrait(P[i],x,y,k);});
// pumpkins front
s+=pumpkin(60,990,22)+pumpkin(950,985,26)+pumpkin(500,995,14);
// title block
s+=`<g filter="drop-shadow(0 6px 4px rgba(0,0,0,.5))">${T(500,140,'UNMASKED',142,{fill:C.parch,ls:8,stroke:C.ink,sw:10})}</g>`;
s+=`<rect x="250" y="160" width="500" height="44" rx="6" fill="${C.red}" stroke="${C.ink}" stroke-width="3"/>`+T(500,192,'THE HOLLOW CREEK BOARD GAME',24,{font:'Atkinson',fill:C.parch,ls:3});
s+=T(500,236,'Solve the haunting. Unmask the person.',22,{font:'Atkinson',w:400,italic:true,fill:C.parch,stroke:'#14263a',sw:4});
// badges
s+=`<g transform="translate(910,560)"><circle r="70" fill="${C.amber}" stroke="${C.ink}" stroke-width="3"/><circle r="62" fill="none" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="4 3"/>${T(0,-14,'PLAYS',14,{font:'Atkinson'})}${T(0,6,'WITH THE',14,{font:'Atkinson'})}${T(0,30,'VIDEO GAME',14,{font:'Atkinson'})}</g>`;
s+=`<rect x="20" y="935" width="290" height="46" rx="23" fill="${C.parch}" stroke="${C.ink}" stroke-width="2.5" opacity=".95"/>`+T(165,966,'1–5 players · 10+ · 45 min',20,{font:'Atkinson'});
const lid=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="2048" height="2048">${DEFS}${s}<rect width="1000" height="1000" fill="url(#vig)"/><rect width="1000" height="1000" fill="#000" filter="url(#grain)" opacity=".35"/></svg>`;
// SIDE strip 1000x200
let t=`<rect width="1000" height="200" fill="${C.teal}"/>`;for(let y=10;y<200;y+=16)for(let x=10+(y/16%2)*8;x<1000;x+=16)t+=circ(x,y,1.3,C.parch,'opacity=".14"');
t+=`<rect x="8" y="8" width="984" height="184" fill="none" stroke="${C.parch}" stroke-width="2" opacity=".7"/>`+T(330,125,'UNMASKED',80,{fill:C.parch,ls:6,stroke:C.ink,sw:6})+T(330,165,'THE HOLLOW CREEK BOARD GAME',18,{font:'Atkinson',fill:C.amberL,ls:3});
t+=`<g transform="translate(720,100)">${haunter('banshee',0,0,.8)}</g><g transform="translate(880,100)">${haunter('baba',0,10,.75)}</g>`+ICON.lantern(620,100,3);
const side=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="2048" height="410">${DEFS}${t}<rect width="1000" height="200" fill="#000" filter="url(#grain)" opacity=".3"/></svg>`;
document.getElementById('art').innerHTML=`<div>${lid}</div><div style="height:410px">${side}</div>`;
document.fonts.ready.then(()=>{window.READY=true});
</script></body></html>
