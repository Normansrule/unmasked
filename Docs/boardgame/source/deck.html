<!doctype html><html><head><meta charset="utf-8"><script src="art.js"></script><script src="icons2.js"></script><script src="cases.js"></script></head><body>
<div id="art" style="display:grid;grid-template-columns:repeat(6,750px);width:4500px"></div>
<script>
document.head.insertAdjacentHTML('beforeend', FONTS);
const Q = new URLSearchParams(location.search); const PAGE = +(Q.get('page') || 0), PER = 12;
const CW = 250, CH = 350; let UID = 0;
function frame(inner, opt = {}) {
  const bg = opt.bg || C.parch, edge = opt.edge || C.ink;
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${CW} ${CH}" width="750" height="1050">${DEFS}
  <rect width="${CW}" height="${CH}" rx="14" fill="${edge}"/><rect x="7" y="7" width="${CW - 14}" height="${CH - 14}" rx="9" fill="${bg}"/>
  <rect x="7" y="7" width="${CW - 14}" height="${CH - 14}" rx="9" fill="#000" filter="url(#grain)" opacity=".6"/>${inner}
  <rect x="12" y="12" width="${CW - 24}" height="${CH - 24}" rx="6" fill="none" stroke="${opt.line || C.ink}" stroke-width=".8" opacity=".6"/></svg>`;
}
const T = (x, y, t, size, o = {}) => `<text x="${x}" y="${y}" font-family="${o.font || 'Fraunces'}" font-weight="${o.w || 700}" font-size="${size}" fill="${o.fill || C.ink}" text-anchor="${o.anchor || 'middle'}" ${o.italic ? 'font-style="italic"' : ''} ${o.ls ? `letter-spacing="${o.ls}"` : ''}>${t}</text>`;
function wrap(x, y, text, size, width, o = {}) {
  const words = text.split(' '); let line = '', lines = [];
  for (const w of words) { if ((line + ' ' + w).length * size * .5 > width && line) { lines.push(line); line = w; } else line = line ? line + ' ' + w : w; }
  lines.push(line); return lines.map((l, i) => T(x, y + i * size * 1.3, l, size, Object.assign({ font: 'Atkinson', w: 400 }, o))).join('');
}
function win(content, bgFill = 'url(#sky)') { const id = 'w' + (UID++); return `<clipPath id="${id}"><rect x="22" y="40" width="206" height="165" rx="8"/></clipPath><g clip-path="url(#${id})"><rect x="22" y="40" width="206" height="165" fill="${bgFill}"/>${content}</g><rect x="22" y="40" width="206" height="165" rx="8" fill="none" stroke="${C.ink}" stroke-width="2"/>`; }
const night = (fill = C.tealM) => `<circle cx="190" cy="70" r="30" fill="url(#moon)" opacity=".8"/>${[[40, 60], [70, 52], [110, 66], [150, 50], [60, 90]].map(([a, b]) => circ(a, b, .9, '#fff', 'opacity=".8"')).join('')}<path d="M22,180 Q80,160 130,175 T228,168 V205 H22 Z" fill="${fill}"/>`;
const boardCrop = ([x0, y0, w0, h0], z = 1) => { const w = w0 * z, h = h0 * z, x = x0 + w0 / 2 - w / 2, y = y0 + h0 / 2 - h / 2; return  `<svg x="22" y="40" width="206" height="165" viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid slice"><image href="out/board.png" width="1000" height="1000"/></svg>`; };
const circled = n => '①②③④⑤'[n - 1];

function caseCard(cs) {
  const m = HOUSE_META[cs.house]; let c = win(boardCrop(m.crop, 1.6));
  c += T(125, 30, `CASE ${m.n}  ·  ${m.short.toUpperCase()}`, 8.5, { font: 'Atkinson', ls: 1.5, fill: C.red });
  const t = cs.case.replace(/^The /, ''); c += T(125, 226, 'The', 12, { fill: C.inkSoft }) + T(125, 246, t, t.length > 18 ? 15 : 18);
  c += wrap(125, 266, cs.premise, 8.4, 196);
  c += `<rect x="30" y="314" width="190" height="20" rx="4" fill="${C.teal}"/>` + T(125, 328, 'Case code  ' + m.code, 9, { font: 'Atkinson', fill: C.amberL, ls: 1 });
  return frame(c);
}
function suspectCard(cs, i) {
  const m = HOUSE_META[cs.house], s = cs.suspects[i]; let c = win(night() + portrait(FACES[s.name], 125, 152, .84));
  c += T(125, 30, 'SUSPECT', 9, { font: 'Atkinson', ls: 3, fill: C.red }) + `<text x="226" y="30" font-family="Atkinson" font-size="7" text-anchor="end" fill="${C.inkSoft}">${circled(m.n)} ${m.short}</text>`;
  c += `<rect x="22" y="212" width="206" height="34" rx="4" fill="${C.parchD}" stroke="${C.ink}" stroke-width="1"/>` + T(125, 234, s.name, s.name.length > 15 ? 14.5 : 17);
  c += T(125, 262, s.job, 10, { font: 'Atkinson', w: 400, italic: true, fill: C.inkSoft });
  SLOT_TRAITS[i].forEach((t, j) => { const x = 62 + j * 63; c += circ(x, 288, 17, j === 0 ? '#f6d6c8' : C.parch, `stroke="${j === 0 ? C.red : C.ink}" stroke-width="${j === 0 ? 2 : 1.2}"`) + ICON[m.icons[t]](x, 288, .85) + T(x, 316, cs.traits[t], 6.8, { font: 'Atkinson' }); });
  c += T(125, 334, 'Alibi: ' + s.room, 8, { font: 'Atkinson', w: 400, italic: true, fill: C.inkSoft });
  return frame(c);
}
function clueCard(cs, t) {
  const m = HOUSE_META[cs.house], cl = cs.clues[t]; let c = '';
  c += `<rect x="22" y="40" width="206" height="150" rx="8" fill="${C.parchD}" stroke="${C.ink}" stroke-width="1.5"/><path d="M22,58 H228" stroke="${C.red}" stroke-width=".8" opacity=".5"/>` + [80, 100, 120, 140, 160, 180].map(y => `<path d="M30,${y} H220" stroke="${C.tealL}" stroke-width=".5" opacity=".5"/>`).join('');
  c += circ(125, 115, 48, C.parch, `stroke="${C.ink}" stroke-width="1.5"`) + ICON[m.icons[t]](125, 115, 2.6);
  c += `<g transform="translate(184,52) rotate(14)"><path d="M0,0 h36 v20 h-36 l-8,-10 Z" fill="${C.red}" stroke="${C.ink}" stroke-width="1"/><circle cx="-2" cy="10" r="2.5" fill="${C.parch}"/><text x="17" y="14" font-family="Atkinson" font-weight="700" font-size="9" fill="${C.parch}" text-anchor="middle">#${t + 1}</text></g>`;
  c += T(125, 30, 'CLUE', 9, { font: 'Atkinson', ls: 3, fill: C.red }) + `<text x="226" y="30" font-family="Atkinson" font-size="7" text-anchor="end" fill="${C.inkSoft}">${circled(m.n)} ${m.short}</text>`;
  c += T(125, 220, cl.name, cl.name.length > 18 ? 13.5 : 16) + T(125, 238, 'Points to: ' + cs.traits[t], 9, { font: 'Atkinson', fill: C.red });
  c += wrap(125, 262, cl.desc, 9, 192);
  c += `<rect x="30" y="306" width="190" height="24" rx="4" fill="none" stroke="${C.ink}" stroke-width=".8" stroke-dasharray="3 2"/>` + T(125, 322, t < 4 ? 'Only one suspect has this' : 'Two suspects share this', 8.5, { font: 'Atkinson', italic: true, w: 400, fill: C.inkSoft });
  return frame(c);
}
const solvers = [
  { name: 'The Sleuth', col: '#3e7a4a', ab: 'Read the Room', txt: 'Once a round, look at one face-down clue token in your space.', p: { skin: '#f1c9a5', hair: '#6b3a2a', hairStyle: 'short', outfit: '#3e7a4a', outfit2: '#2e5c38', collar: 'cape', hat: 'deerstalker', hatc: '#8a6a3e', mood: 'happy' } },
  { name: 'The Techie', col: '#2f5a9a', ab: 'Ghost Meter', txt: 'Before the Haunter moves, ask: is it within 3 spaces of me?', p: { skin: '#b9825e', hair: '#1f1a1c', hairStyle: 'curly', outfit: '#2f5a9a', headphones: '#e2b23c', glasses: C.ink, mood: 'happy' } },
  { name: 'The Brawn', col: '#a83232', ab: 'Steady Hands', txt: 'Carry 2 trap pieces. Fear from Possess cards can\'t reach you.', p: { skin: '#e9b892', hair: '#2d2420', hairStyle: 'spiky', outfit: '#a83232', scarf: C.amber, mood: 'cross' } },
  { name: 'The Snacker', col: '#c9a03a', ab: 'Snack Break', txt: 'Spend a Snack token: everyone in your space drops 1 Fear.', p: { skin: '#f4d1b5', hair: '#a8693a', hairStyle: 'bob', outfit: '#d8b23a', hat: 'bobble', hatc: '#5aa39a', freckles: true, mood: 'open' } },
];
function solverCard(i) {
  const s = solvers[i]; let c = win(night(shade(s.col, .7)) + portrait(s.p, 125, 152, .84));
  c += T(125, 30, 'MYSTERY CLUB', 9, { font: 'Atkinson', ls: 3, fill: s.col });
  c += `<rect x="22" y="212" width="206" height="34" rx="4" fill="${s.col}" stroke="${C.ink}" stroke-width="1"/>` + T(125, 235, s.name, 18, { fill: C.parch });
  c += ICON.magnifier(40, 268, .8) + T(56, 272, s.ab, 12, { anchor: 'start' }) + wrap(125, 292, s.txt, 9, 190);
  c += [0, 1, 2, 3, 4].map(k => circ(80 + k * 22, 330, 6, k < 3 ? C.parch : C.violetL, `stroke="${C.ink}" stroke-width="1"`)).join('') + T(52, 333, 'Fear', 8, { font: 'Atkinson' });
  return frame(c);
}
const masks = [['horseman', 'The Headless Horseman', 'Pumpkin Toss', 'Burst a pumpkin on a space next to the Haunter: every Solver there gains 1 Fear.'], ['banshee', 'The Banshee', 'Wail', 'Every Solver within 2 spaces gains 1 Fear, then moves 1 space away.'], ['jack', 'Stingy Jack', 'Lantern Trick', 'Swap one lit lantern on the board with an empty space. It still counts, if they can find it.'], ['baba', 'Baba Yaga', 'Hex', 'Put a Hex token on a path. Crossing it costs a Solver 1 extra move.']];
function maskCard(i) {
  const [k, n, pw, txt] = masks[i]; let c = win(circ(125, 122, 90, C.violet, 'opacity=".25"') + haunter(k, 125, 128, .95), '#241a33');
  c += T(125, 30, 'FOLKLORE MASK', 9, { font: 'Atkinson', ls: 3, fill: C.violetL });
  c += `<rect x="22" y="212" width="206" height="34" rx="4" fill="${C.violet}" stroke="${C.ink}" stroke-width="1"/>` + T(125, 234, n, n.length > 16 ? 13 : 16, { fill: C.parch });
  c += T(125, 268, pw, 13, { fill: C.violetL }) + wrap(125, 288, txt, 9, 190, { fill: C.parch });
  return frame(c, { bg: '#2c2140', line: C.violetL });
}
const haunts = [['Possess!', 'ghost', 'Possess', 'A chair, a lamp or a teapot jumps. Solvers in the case house gain 1 Fear and drop a clue token where they stand.'], ['Fog Rolls In', 'ghost', 'Fog', 'Lay a fog cloud on any 3 spaces. Solvers there can\'t Search this round.'], ['Lights Out', 'lantern', 'Flicker', 'Turn one lit lantern face down. Relight it with an action.'], ['Phantom Double', 'ghost', 'Illusion', 'Put a second Haunter standee 4 spaces away. Only the Ghost Meter or a Search shows which is real.'], ['Slam!', 'ghost', 'Door', 'Block one path next to the Haunter until the end of the next round.'], ['Midnight Chime', 'lantern', 'Clock', 'The town clock skips ahead. Move the midnight marker one extra hour, unless 6 or more lanterns are lit.']];
function hauntCard(i) {
  const [n, ic, tag, txt] = haunts[i]; let c = `<rect x="22" y="40" width="206" height="150" rx="8" fill="#3a2c52" stroke="${C.ink}" stroke-width="1.5"/>`;
  c += circ(125, 115, 60, C.violet, 'opacity=".35"') + circ(125, 115, 34, C.violetL, 'opacity=".25"') + ICON[ic](125, 118, 3.6);
  for (let k = 0; k < 14; k++) c += circ(30 + rnd() * 190, 50 + rnd() * 130, .8 + rnd(), '#fff', 'opacity=".5"');
  c += T(125, 30, 'HAUNT', 9, { font: 'Atkinson', ls: 3, fill: C.violetL }) + T(125, 222, n, 16, { fill: C.parch }) + `<rect x="95" y="230" width="60" height="14" rx="7" fill="${C.violet}"/>` + T(125, 241, tag, 8.5, { font: 'Atkinson', fill: C.parch });
  c += wrap(125, 264, txt, 9.2, 190, { fill: C.parch });
  return frame(c, { bg: '#2c2140', line: C.violetL });
}
const places = [
  ['Ravencrag Castle', [125, 90, 165, 132], 'The suit of armour walks the battlements.', 'Bust it: the Brawn and a lit lantern on the castle space.'],
  ['Cackling Circus', [95, 360, 140, 112], 'A ventriloquist\'s dummy laughs in the empty tent.', 'Bust it: the Snacker plus any Solver, and one Snack token.'],
  ['Crowley Tower', [500, 690, 130, 104], 'The lift runs all night with nobody in it.', 'Bust it: the Techie on the tower space for a whole round.'],
  ['Saltmarsh Harbor', [790, 400, 140, 112], 'The lighthouse lamp flickers out at midnight.', 'Bust it: carry 2 lantern tokens to the harbor space.'],
  ['Smugglers\' Cave', [730, 150, 150, 120], 'Ghost lights bob deep inside the cave.', 'Bust it: the Sleuth, after finding any 2 clues this game.'],
  ['Witchwood Swamp', [80, 790, 160, 128], 'A broom sweeps the shack porch by itself.', 'Bust it: any 2 Solvers on the swamp space together.'],
];
function placeCard(i) {
  const [n, crop, story, how] = places[i]; let c = win(boardCrop(crop));
  c += T(125, 30, 'HAUNTED PLACE', 9, { font: 'Atkinson', ls: 3, fill: C.violet });
  c += `<rect x="22" y="212" width="206" height="34" rx="4" fill="${C.teal}" stroke="${C.ink}" stroke-width="1"/>` + T(125, 234, n, 16, { fill: C.parch });
  c += wrap(125, 264, story, 9, 190, { italic: true }) + wrap(125, 292, how, 9, 190, { w: 700 });
  c += T(125, 330, 'Reward: 1 Curio token', 8.5, { font: 'Atkinson', fill: C.red });
  return frame(c);
}
function back(kind) {
  const bg = { haunt: '#2c2140', mask: '#2c2140', clue: C.red, suspect: C.teal, case: '#3b2c52', place: '#22392f' }[kind]; let c = `<rect x="7" y="7" width="236" height="336" rx="9" fill="${bg}"/>`;
  for (let y = 20; y < 340; y += 18) for (let x = 20 + (y / 18 % 2) * 9; x < 240; x += 18) c += circ(x, y, 1.4, C.parch, 'opacity=".16"');
  c += `<rect x="22" y="22" width="206" height="306" rx="8" fill="none" stroke="${C.parch}" stroke-width="1.5" opacity=".7"/><rect x="28" y="28" width="194" height="294" rx="6" fill="none" stroke="${C.parch}" stroke-width=".6" opacity=".6"/>`;
  c += circ(125, 160, 58, kind === 'haunt' || kind === 'mask' ? C.violet : C.amber, 'opacity=".25"');
  c += kind === 'clue' ? ICON.magnifier(125, 160, 4.4) : kind === 'haunt' ? ICON.ghost(125, 160, 4.4) : kind === 'mask' ? haunter('jack', 125, 170, .7) : ICON.lantern(125, 160, 4);
  c += T(125, 250, 'UNMASKED', 24, { fill: C.parch, ls: 3 }) + T(125, 272, { haunt: 'HAUNT', clue: 'CLUE', suspect: 'SUSPECT', mask: 'FOLKLORE MASK', case: 'CASE', place: 'HAUNTED PLACE' }[kind], 10, { font: 'Atkinson', fill: C.parch, ls: 4 });
  return frame(c, { bg, line: C.parch });
}
// full deck in order
const order = ['PembertonCottage', 'HollowCreekFarm', 'WillowLaneVictorian', 'BlackwoodManor', 'HistoricalSociety'];
const DECK = [];
for (const h of order) { const cs = CASES.find(c => c.house === h); DECK.push(['case-' + h, () => caseCard(cs)]); for (let i = 0; i < 4; i++) DECK.push([`suspect-${h}-${i}`, () => suspectCard(cs, i)]); for (let t = 0; t < 8; t++) DECK.push([`clue-${h}-${t + 1}`, () => clueCard(cs, t)]); }
for (let i = 0; i < 4; i++) DECK.push(['solver-' + i, () => solverCard(i)]);
for (let i = 0; i < 4; i++) DECK.push(['mask-' + i, () => maskCard(i)]);
for (let i = 0; i < 6; i++) DECK.push(['haunt-' + i, () => hauntCard(i)]);
for (let i = 0; i < 6; i++) DECK.push(['place-' + i, () => placeCard(i)]);
for (const k of ['case', 'suspect', 'clue', 'haunt', 'mask', 'place']) DECK.push(['back-' + k, () => back(k)]);
window.DECK_NAMES = DECK.map(d => d[0]);
const slice = DECK.slice(PAGE * PER, PAGE * PER + PER);
document.getElementById('art').innerHTML = slice.map(([n, f]) => `<div style="width:750px;height:1050px">${f()}</div>`).join('');
const imgs = [...document.querySelectorAll('image')];
Promise.all([document.fonts.ready, ...imgs.map(im => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = im.getAttribute('href'); }))]).then(() => setTimeout(() => { window.READY = true; }, 1500));
</script></body></html>
